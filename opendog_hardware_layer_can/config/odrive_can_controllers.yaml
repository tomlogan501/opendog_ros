controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Broadcaster d'état des joints (toujours nécessaire)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 🔥 UN SEUL contrôleur pour TOUS les joints en groupe
    all_joints_controller:
      type: position_controllers/JointGroupPositionController

# Paramètres du contrôleur de groupe
all_joints_controller:
  ros__parameters:
    joints:
      - "FR_hip_joint"
      - "FR_uleg_joint"
      - "FR_lleg_joint"
      - "FL_hip_joint"
      - "FL_uleg_joint"
      - "FL_lleg_joint"
      - "BR_hip_joint"
      - "BR_uleg_joint"
      - "BR_lleg_joint"
      - "BL_hip_joint"
      - "BL_uleg_joint"
      - "BL_lleg_joint"
    interface_name: "position"

# Configuration matérielle CAN
hardware:
  ros__parameters:
    can_interface: "can0"
    
    # Sensors (VBUS voltage)
    sensors:
      - name: "vbus_sensor"
        type: "sensor"
        parameters:
          node_id: "0"    # Node ID pour la lecture VBUS
    
    # Joints - configuration CAN (pour test avec 1-2 joints)
    joints:
      # 🔥 POUR TEST : Seulement 2 joints sur une carte
      - name: "FR_hip_joint"
        type: "joint"
        parameters:
          node_id: "1"    # Node ID ODrive 1
          axis: "0"       # Axe 0 sur cette ODrive
          enable_watchdog: "true"
          watchdog_timeout: "0.1"
      
      - name: "FR_uleg_joint"
        type: "joint" 
        parameters:
          node_id: "1"    # Même ODrive, axe différent
          axis: "1"       # Axe 1 sur cette ODrive
          enable_watchdog: "true"
          watchdog_timeout: "0.1"

      # 🔥 COMMENTÉ : Ajouter les autres joints plus tard
      # - name: "FR_lleg_joint"
      #   type: "joint"
      #   parameters:
      #     node_id: "2"
      #     axis: "0"
      #     enable_watchdog: "true"
      #     watchdog_timeout: "0.1"
      #
      # - name: "FL_hip_joint"
      #   type: "joint"
      #   parameters:
      #     node_id: "3"
      #     axis: "0"
      #     enable_watchdog: "true"
      #     watchdog_timeout: "0.1"
